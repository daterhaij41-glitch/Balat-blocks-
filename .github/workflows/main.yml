
name: Build BalatBlocks APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v7

      - name: Install Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 34
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Find and Build Android Project
        shell: bash
        run: |
          set -euo pipefail

          WRAPPER=$(find . -type f -name gradlew \
            -not -path '*/.gradle/*' -print -quit)

          if [ -z "$WRAPPER" ]; then
            echo "::error::Could not find gradlew."
            echo "The complete Android project must be uploaded."
            ls -la
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")

          echo "Project location: $PROJECT_DIR"

          chmod +x "$WRAPPER"
          cd "$PROJECT_DIR"

          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: BalatBlocks-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14
          
