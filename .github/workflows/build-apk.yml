name: Build BalatBlocks APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK Packages
        run: |
          sdkmanager --licenses
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Extract ZIP Project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/_source"

          ZIP_FOUND=false

          while IFS= read -r -d '' ZIP_FILE; do
            echo "Extracting: $ZIP_FILE"
            unzip -oq "$ZIP_FILE" -d "$GITHUB_WORKSPACE/_source"
            ZIP_FOUND=true
          done < <(
            find . -type f -iname "*.zip" \
              ! -path "./.git/*" \
              ! -path "./_source/*" \
              -print0
          )

          if [ "$ZIP_FOUND" = false ]; then
            echo "::error::No ZIP project file found in repository."
            exit 1
          fi

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail

          WRAPPER=$(find "$GITHUB_WORKSPACE/_source" \
            -type f -name gradlew -print -quit)

          if [ -z "$WRAPPER" ]; then
            echo "::error::No gradlew found inside ZIP."
            echo "Extracted files:"
            find "$GITHUB_WORKSPACE/_source" \
              -maxdepth 5 -type f | head -150
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")

          echo "Android project: $PROJECT_DIR"

          cd "$PROJECT_DIR"
          chmod +x gradlew

          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: BalatBlocks-APK
          path: "_source/**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14
          
